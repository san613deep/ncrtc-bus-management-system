# =============================================================
# alembic.ini — Alembic Database Migration Config
# =============================================================
# Run migrations: alembic upgrade head
# Create a new migration: alembic revision --autogenerate -m "add_field_x"
# Roll back one step: alembic downgrade -1

[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration file names
file_template = %%(rev)s_%%(slug)s

# Connection URL — override this with env var in Docker
# (the sqlalchemy.url is also set programmatically in env.py)
sqlalchemy.url = postgresql://ncrtc:password@localhost:5432/ncrtc_bms

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
