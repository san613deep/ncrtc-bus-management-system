# =============================================================
# GitHub Actions CI Pipeline
# Runs on every Pull Request to main
# Checks: Python tests, Spring Boot tests, frontend type check
# =============================================================

name: CI — Test & Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, "portfolio/**"]

jobs:
  # -----------------------------------------------------------
  # Job 1: Test FastAPI Backend
  # -----------------------------------------------------------
  test-backend:
    name: FastAPI Tests
    runs-on: ubuntu-latest

    services:
      # Spin up PostgreSQL for tests
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ncrtc_test
          POSTGRES_USER: ncrtc
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Redis for tests
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://ncrtc:test_password@localhost:5432/ncrtc_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_secret_for_ci_only_32_chars_long
          INTERNAL_API_KEY: test_internal_key
          TICK_API_KEY: test_tick_key
          SCHEDULING_SERVICE_URL: http://localhost:8080
        run: alembic upgrade head

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://ncrtc:test_password@localhost:5432/ncrtc_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_secret_for_ci_only_32_chars_long
          INTERNAL_API_KEY: test_internal_key
          TICK_API_KEY: test_tick_key
          SCHEDULING_SERVICE_URL: http://localhost:8080
        run: pytest tests/ -v --tb=short

  # -----------------------------------------------------------
  # Job 2: Test Spring Boot Scheduling Service
  # -----------------------------------------------------------
  test-scheduling:
    name: Spring Boot Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ncrtc_test
          MYSQL_USER: ncrtc
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./scheduling-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run Maven tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ncrtc_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: ncrtc
          SPRING_DATASOURCE_PASSWORD: test_password
          INTERNAL_API_KEY: test_internal_key
        run: mvn test -q

  # -----------------------------------------------------------
  # Job 3: Frontend Type Check
  # -----------------------------------------------------------
  check-frontend:
    name: Next.js Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint check
        run: npx eslint .

  # -----------------------------------------------------------
  # Job 4: Docker Build Smoke Test
  # Ensures all Dockerfiles build without error
  # -----------------------------------------------------------
  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [test-backend, test-scheduling, check-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Copy .env for build
        run: cp .env.example .env

      - name: Build all Docker images
        run: docker compose build --no-cache

      - name: Verify images were created
        run: docker images | grep ncrtc
